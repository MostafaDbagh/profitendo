server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 error_page 404 /404.html;

 location = /service-worker.js { add_header Cache-Control "no-store"; try_files $uri =404; }
 location = /index.html { return 308 /; }
 location = /app.html {
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files $uri =404;
 }
 location = /404.html {
  internal;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
 }

 # Serve pre-rendered HTML at stable, slashless canonical public URLs.
 location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
 location = /features { add_header Cache-Control "no-cache"; try_files /features/index.html =404; }
 location = /pricing { add_header Cache-Control "no-cache"; try_files /pricing/index.html =404; }
 location = /about { add_header Cache-Control "no-cache"; try_files /about/index.html =404; }
 location = /en { add_header Cache-Control "no-cache"; try_files /en/index.html =404; }
 location = /en/features { add_header Cache-Control "no-cache"; try_files /en/features/index.html =404; }
 location = /en/pricing { add_header Cache-Control "no-cache"; try_files /en/pricing/index.html =404; }
 location = /en/about { add_header Cache-Control "no-cache"; try_files /en/about/index.html =404; }
 location ~ ^/(features|pricing|about|en|en/features|en/pricing|en/about)/$ { return 308 /$1$is_args$args; }
 location ~ ^/(features|pricing|about|en|en/features|en/pricing|en/about)/index\.html$ { return 308 /$1$is_args$args; }

 # Authenticated/account routes get a generic shell, never public indexable HTML.
 location ~ ^/(auth|auth-v2|business|business-v2|billing-v2|platform-v2|contact)/?$ {
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files /app.html =404;
 }
 location ~ ^/sales-v2/[^/]+/[^/]+/receipt/?$ {
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files /app.html =404;
 }
 location = /product-overview.md { types {} default_type "text/markdown; charset=utf-8"; try_files $uri =404; }
 location /static/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
 # Missing assets and unknown pages must not return a 200 SPA shell (soft 404).
 location / { try_files $uri =404; }
}
