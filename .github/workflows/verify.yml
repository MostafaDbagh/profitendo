name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: profitendo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d profitendo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:local-ci-only@localhost:5432/profitendo_test
      TEST_DATABASE_URL: postgresql://test:local-ci-only@localhost:5432/profitendo_test
    defaults:
      run:
        working-directory: backend-node
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-node/package-lock.json
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate
      - run: npm run typecheck && npm test && npm run test:integration && npm run build
      - run: python3 -m unittest backend.tests.test_cutover
        working-directory: .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn build
        working-directory: frontend
        env:
          REACT_APP_AUTH_API_URL: https://app.example.com
          REACT_APP_B2B_PRIMARY: 'true'
